name: Hub Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.13.4
  TF_VAR_spoke_account_id: "434097521299"
  TF_VAR_allow_external_ram_principals: "true"
  TF_VAR_subnets: >-
    {
      "private_1": {
        "cidr_block": "10.0.0.0/24",
        "availability_zone": "ap-south-1a",
        "public": false
      },
      "public_1": {
        "cidr_block": "10.0.2.0/24",
        "availability_zone": "ap-south-1a",
        "public": true
      },
      "private_2": {
        "cidr_block": "10.0.1.0/24",
        "availability_zone": "ap-south-1b",
        "public": false
      },
      "public_2": {
        "cidr_block": "10.0.3.0/24",
        "availability_zone": "ap-south-1b",
        "public": true
      }
    }

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Plan in hub account
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials in hub account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-test-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "647132523867" ]; then
            echo "::error::Expected hub account 647132523867, got $account_id"
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform changes
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: hub-terraform-plan
          path: terraform/tfplan
          retention-days: 5

  apply:
    name: Apply in hub account
    needs: plan
    if: github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials in hub account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-test-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "647132523867" ]; then
            echo "::error::Expected hub account 647132523867, got $account_id"
            exit 1
          fi

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: hub-terraform-plan
          path: terraform

      - name: Apply Terraform plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show Transit Gateway outputs
        run: |
          terraform output transit_gateway_id
          terraform output ram_resource_share_arn   
